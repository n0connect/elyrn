# elyrn. client authentication for the bundled PostgreSQL (mounted read-only, passed as
# hba_file, so the copy initdb wrote into the data volume is ignored and never edited).
# First match wins.

# Unix socket inside the container only (healthcheck, make shell-db, make backup-accounts):
# reaching it already takes `docker exec`, i.e. root on the host. Same as the image default.
local     all  all                 trust

# Every TCP connection must be TLS: the backend over the compose network, psql or tests
# through the loopback-published port. Plain TCP is refused before authentication.
hostnossl all  all  0.0.0.0/0      reject
hostnossl all  all  ::/0           reject
hostssl   all  all  0.0.0.0/0      scram-sha-256
hostssl   all  all  ::/0           scram-sha-256
