name: ci

on:
  push:
    # The branch and the test database names are kept as "noaddx" across the rename to elyrn.
    branches: [main, elyrn-dev]
    tags: ["elyrn-*"]
  pull_request:

permissions:
  contents: read

# Go 1.27.4 everywhere (carries the crypto/x509 fix GO-2026-6809 and the net/http fix GO-2026-6859); the backend jobs run in
# golang:1.27.4-trixie because Debian trixie ships OpenSSL 3.5 LTS (Ubuntu 24.04 has 3.0)
jobs:
  backend:
    name: backend (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    # Debian trixie carries OpenSSL 3.5 LTS; Ubuntu 24.04 still ships 3.0, below the engine's floor
    container: golang:1.27.4-trixie
    strategy:
      fail-fast: false
      matrix:
        engine: [openssl, native]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noaddx_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: OpenSSL headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libssl-dev pkg-config
          pkg-config --modversion libcrypto
      - name: Engine flags
        run: |
          if [ "${{ matrix.engine }}" = openssl ]; then
            echo "CGO_ENABLED=1" >> "$GITHUB_ENV"; echo "GO_TAGS=test openssl" >> "$GITHUB_ENV"
          else
            echo "CGO_ENABLED=0" >> "$GITHUB_ENV"; echo "GO_TAGS=test" >> "$GITHUB_ENV"
          fi
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go vet -tags "$GO_TAGS" ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags "$GO_TAGS" ./...
      - name: Tests (complete suite, race detector)
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: noaddx_test
        # -race needs cgo; the native engine's production build stays CGO_ENABLED=0 (checked below)
        run: CGO_ENABLED=1 go test -p 1 -race -count=1 -tags "$GO_TAGS" ./...
      - name: Fuzz targets (short run)
        # every Go fuzz target, sorted by package then target: the one list (make fuzz reads it;
        # scripts/check-fuzz-targets.py, run in the frontend job and by make check-hardening, keeps it complete)
        env:
          FUZZTIME: 10s
        run: |
          fuzz() { go test -tags "$GO_TAGS" -run '^$' -fuzz "^$2\$" -fuzztime "$FUZZTIME" "$1"; }
          fuzz ./internal/agent FuzzClassifyServerURL
          fuzz ./internal/agent FuzzDecodeCounterRooms
          fuzz ./internal/agent FuzzEventStream
          fuzz ./internal/agent FuzzOpenServedMessage
          fuzz ./internal/agent FuzzParseIdentity
          fuzz ./internal/agent FuzzReceivedText
          fuzz ./internal/agent FuzzRoomPages
          fuzz ./internal/agent FuzzServedRole
          fuzz ./internal/agent FuzzServerAnswer
          fuzz ./internal/agent FuzzSolveChallenge
          fuzz ./internal/apperr FuzzEdgeBody
          fuzz ./internal/apperr FuzzWriteCode
          fuzz ./internal/apperr FuzzWriteError
          fuzz ./internal/chat FuzzClockTrusted
          fuzz ./internal/chat FuzzMessageWindow
          fuzz ./internal/chat FuzzParseRoomInput
          fuzz ./internal/chat FuzzPartCounter
          fuzz ./internal/chat FuzzRosterDigestMatchesClient
          fuzz ./internal/contract FuzzGateFileRead
          fuzz ./internal/contract FuzzGateLoginBody
          fuzz ./internal/contract FuzzGateRequest
          fuzz ./internal/contract FuzzIntegerLiteral
          fuzz ./internal/contract FuzzPatternChallenge
          fuzz ./internal/contract FuzzPatternFilePart
          fuzz ./internal/contract FuzzPatternInviteToken
          fuzz ./internal/contract FuzzPatternKey32
          fuzz ./internal/contract FuzzPatternMessage
          fuzz ./internal/contract FuzzPatternNote
          fuzz ./internal/contract FuzzPatternPartQuery
          fuzz ./internal/contract FuzzPatternPendingToken
          fuzz ./internal/contract FuzzPatternRoomCard
          fuzz ./internal/contract FuzzPatternRoomRole
          fuzz ./internal/contract FuzzPatternRoomVault
          fuzz ./internal/contract FuzzPatternSalt
          fuzz ./internal/contract FuzzPatternSeqQuery
          fuzz ./internal/contract FuzzPatternSolution
          fuzz ./internal/contract FuzzPatternUUIDv4
          fuzz ./internal/database FuzzClassify
          fuzz ./internal/e2e FuzzAura
          fuzz ./internal/e2e FuzzDecrypt
          fuzz ./internal/e2e FuzzDecryptBindings
          fuzz ./internal/e2e FuzzMutateRoomMessage
          fuzz ./internal/e2e FuzzOpenRoomCard
          fuzz ./internal/e2e FuzzOpenRoomMessage
          fuzz ./internal/e2e FuzzOpenRoomNote
          fuzz ./internal/e2e FuzzOpenRoomRole
          fuzz ./internal/e2e FuzzOpenRoomVault
          fuzz ./internal/e2e FuzzParseRoomCode
          fuzz ./internal/e2e FuzzRoleText
          fuzz ./internal/e2e FuzzRoomCodeBuild
          fuzz ./internal/e2e FuzzRoomSafetyNumber
          fuzz ./internal/e2e FuzzRosterDigest
          fuzz ./internal/handlers FuzzHealthLoopback
          fuzz ./internal/mcp FuzzRoleArguments
          fuzz ./internal/mcp FuzzRoomCodeArgument
          fuzz ./internal/mcp FuzzServe
          fuzz ./internal/mcp FuzzToolArguments
          fuzz ./internal/pow FuzzCheckSolutionWindow
          fuzz ./internal/pow FuzzSpentSet
          fuzz ./internal/pow FuzzTagMutation
          fuzz ./internal/pow FuzzValidateSolution
          fuzz ./internal/realtime FuzzHubOperations
          fuzz ./internal/server FuzzRouteChain
          fuzz ./internal/utils FuzzAdmitLine
          fuzz ./internal/utils FuzzClockSteady
          fuzz ./internal/utils FuzzDecodeExact
          fuzz ./internal/utils FuzzFilePartCount
          fuzz ./internal/utils FuzzParseOrigins
          fuzz ./internal/utils FuzzParseProxyList
          fuzz ./internal/utils FuzzParseRoomBlob
          fuzz ./internal/utils FuzzScrubPeerAddresses
          fuzz ./tests/auth FuzzAccountLookup
          fuzz ./tests/auth FuzzVerifyAccountNumberHash
          fuzz ./tests/auth FuzzVerifyPendingToken
          fuzz ./tests/auth FuzzVerifyToken
          fuzz ./tests/database FuzzValidateStartupConfig
          fuzz ./tests/encryption FuzzOpenWithKeyID
          fuzz ./tests/encryption FuzzSealRoundTrip
          fuzz ./tests/identity FuzzDeriveFromAccountNumber
          fuzz ./tests/identity FuzzValidateEncodedKey
          fuzz ./tests/middleware FuzzCORS
          fuzz ./tests/middleware FuzzClientKey
          fuzz ./tests/middleware FuzzRecover
          fuzz ./tests/utils FuzzParseCanonicalUUIDv4
          fuzz ./tests/utils FuzzValidateCiphertext
          fuzz ./tests/utils FuzzValidateInviteToken
      - name: Production build (same flags as the Dockerfile)
        run: |
          if [ "${{ matrix.engine }}" = openssl ]; then
            CGO_ENABLED=1 go build -tags openssl -trimpath -buildvcs=false -ldflags="-s -w" -o /tmp/elyrn ./cmd/server
          else
            CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o /tmp/elyrn ./cmd/server
          fi

  equivalence:
    name: crypto engines are byte-for-byte equivalent
    runs-on: ubuntu-24.04
    container: golang:1.27.4-trixie
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config
      - run: CGO_ENABLED=1 go test -count=1 -v -tags "test openssl" ./internal/cryptoengine/...

  frontend:
    name: frontend (WebCrypto interop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test frontend/tests/*.test.mjs
      - name: Go fuzz targets are all listed in the fuzz step, once, and all exist
        run: python3 -I scripts/check-fuzz-targets.py

  security:
    name: vulnerabilities and secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.sum
      - name: govulncheck (reachable vulnerabilities only)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .

  images:
    name: docker images build (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        engine: [openssl, native]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg ENGINE=${{ matrix.engine }} -f dev.backend.Dockerfile -t elyrn-backend:${{ matrix.engine }} .
      - run: docker build -f dev.frontend.Dockerfile -t elyrn-frontend .
      - run: docker build -f tor.Dockerfile -t elyrn-tor .
      - name: nginx renders and accepts its config; tor accepts its config with the onion defenses
        run: |
          docker run --rm --add-host elyrn-backend:127.0.0.1 -e TOR_IP=172.29.73.11 elyrn-frontend nginx -t
          docker run --rm --add-host frontend:172.29.73.10 elyrn-tor --verify-config
      - name: image runs as the unprivileged user and passes its self-test
        run: |
          docker run --rm --entrypoint id elyrn-backend:${{ matrix.engine }} | grep -q 'uid=10001'
          docker run --rm -e JWT_SECRET="$(openssl rand -hex 32)" -e MASTER_KEY_ACTIVE="$(openssl rand -hex 32)" \
            -e MASTER_KEY_ACTIVE_ID=ci -e ACCOUNT_LOOKUP_PEPPER="$(openssl rand -hex 32)" -e DB_PASSWORD="$(openssl rand -hex 16)" \
            -e DB_HOST=127.0.0.1 elyrn-backend:${{ matrix.engine }} 2>&1 | grep -q 'self-test passed'
