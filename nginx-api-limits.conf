# Included by every proxied /api/ location in nginx-site.conf but the event stream, which has its
# own pool (/etc/nginx/elyrn/api-limits.conf). At most 16 requests at once per client (an IPv4
# address, an IPv6 /64 or a Tor circuit: $client_network, nginx.conf) and 128 for all clients
# together; nginx-main.conf sizes 128 from the worker pool and the container's memory. A request
# over either answers 503 E_BACKEND_UNAVAILABLE (nginx-api-errors.conf). Counted from before the
# body is read, so a slowly sent body holds one of these slots, never more than the client's 16.

limit_conn api_per_client 16;
limit_conn api_all 128;
