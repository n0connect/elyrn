# Included by every /api/ location (/etc/nginx/elyrn/api-errors.conf). The backend's own answers
# pass through untouched: its bodies are already shaped by the input contract's gate and apperr,
# and the browser maps them by status and message. Only failures nginx produces itself (the
# backend down or slow, the whitelist, a body bound, the rate limit) are answered here, by the
# named locations in nginx-site.conf: small JSON in apperr's JSON shape plus the registered code
# (backend/internal/apperr/edge.go). Every error_page names its answer's status with =NNN: without
# it nginx keeps the triggering status (a 504 stayed 504 although the location returns 503).
# make check-hardening keeps both in step.

proxy_intercept_errors off;
error_page 404 =404 @api_not_found;
error_page 405 =405 @api_method_not_allowed;
error_page 413 =413 @api_body_too_large;
error_page 429 =429 @api_rate_limited;
error_page 500 502 503 504 =503 @api_unavailable;
