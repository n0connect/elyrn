# Shared by both listeners in nginx.conf (clearnet and onion). $client_addr is the TCP peer,
# or the Tor circuit behind the onion listener; it is the only client address forwarded.

server_tokens off;

# Zero telemetry: no access log (it would record IP, time and path of every request),
# and only critical errors (lower levels can include client addresses)
access_log off;
error_log /dev/stderr crit;

root /usr/share/nginx/html;
index index.html;

# Outside /api/ nothing takes a body; every /api/ location below sets its own bound from the
# input contract (docs/api/input-contract.md), the smallest round size above the contract's
client_max_body_size 1k;
# Headers: one 1k buffer, at most four of 8k for long lines (SERVER_MAX_HEADER_BYTES is 8192)
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
# Slow clients (slowloris) give up a connection after 10 s without progress
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
keepalive_timeout 30s;
# The backend is on the same host: a connect that takes longer means it is down
proxy_connect_timeout 5s;
# nginx listens on 8080 inside the container: redirects stay relative, never naming that port
absolute_redirect off;

# The API uses GET (HEAD), POST and DELETE; OPTIONS answers CORS preflight. Anything else is
# refused here with the status the backend would give, for static files too.
if ($request_method !~ ^(GET|HEAD|POST|DELETE|OPTIONS)$) {
    return 405;
}

# Include default MIME types and ensure SVG files are served correctly
include /etc/nginx/mime.types;
types {
    image/svg+xml svg svgz;
}

# Error pages
error_page 404 /e0ab670f-6801-4475-b337-c08d5adb9e73.html;

# Security headers for frontend (SPA)
# worker-src 'self' allows Web Workers (used by PoW computation in registration)
# The policy name is kept as "noaddx" across the rename to elyrn (frontend/js/auth.js).
# Trusted Types: one policy (noaddx-worker) that whitelists the PoW worker URL; every other sink throws
# No 'unsafe-inline' anywhere: initial visibility comes from the stylesheet ([data-hidden])
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; require-trusted-types-for 'script'; trusted-types noaddx-worker;" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
# Cross-origin isolation: the app loads nothing from other origins
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Dotfiles (.git, .env, editor leftovers) are never served, whatever their extension; first
# regex location, so it wins over the static file rule below
location ~ /\. {
    return 404;
}

# Static files - CSS, JS, fonts, images
location ~ \.(css|js|ttf|woff|woff2|png|jpg|jpeg|gif|svg|ico)$ {
    # `expires` instead of add_header: any add_header here would silently drop every
    # server-level security header (nosniff, CSP, CORP...) for these files.
    # `epoch` means Cache-Control: no-cache: every load revalidates (ETag, mostly 304), so a
    # browser never runs a new page with old scripts, and a fix reaches users on their next load
    expires epoch;
    try_files $uri =404;
}

# Static directories
location ~ ^/(fonts|images|js)/ {
    try_files $uri =404;
}

# ---- API: default-deny whitelist mirroring the input contract (docs/api/input-contract.md,
# backend/internal/contract). One location per route group: exact anchored paths ({id} and
# {note} are canonical [0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}v4), the contract's methods (HEAD rides along with GET and is
# answered by the backend; OPTIONS is CORS preflight, answered by the backend), and a body
# bound at the smallest round size above the contract's (bodiless routes: 1k). A method outside
# the list answers 405 like the backend, an unknown path 404. The backend's gate still checks
# everything again (query, content type, body shape, fields).

# Server-Sent Events: long-lived and unbuffered; errors are NOT intercepted so
# EventSource sees the real status (401 = session revoked)
location = /api/v2/events {
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15m;
    gzip off;
}

# GET: proof-of-work challenge, conversation list
location ~ ^/api/v2/(pow/challenge|conversations)$ {
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    include /etc/nginx/elyrn/api-errors.conf;
}

# GET and DELETE (body <= 123 bytes): the account
location = /api/v2/me {
    if ($request_method !~ ^(GET|HEAD|DELETE|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    include /etc/nginx/elyrn/api-errors.conf;
}

# POST, bodies <= 292 bytes: login, logout, invites, invite redemption
location ~ ^/api/v2/(login|logout|invites|invites/redeem)$ {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    include /etc/nginx/elyrn/api-errors.conf;
}

# POST, bodies <= 1351 bytes: registration, rooms, joining a room
location ~ ^/api/v2/(register|rooms|rooms/join)$ {
    client_max_body_size 2k;
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    include /etc/nginx/elyrn/api-errors.conf;
}

# POST (body <= 93 bytes): read marker
location ~ "^/api/v2/conversations/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/read$" {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    include /etc/nginx/elyrn/api-errors.conf;
}

# GET: room members
location ~ "^/api/v2/conversations/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/members$" {
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    include /etc/nginx/elyrn/api-errors.conf;
}

# GET and POST (bodies <= 7873 bytes): messages and notes
location ~ "^/api/v2/conversations/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/(messages|notes)$" {
    client_max_body_size 8k;
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    include /etc/nginx/elyrn/api-errors.conf;
}

# DELETE: a conversation, a note
location ~ "^/api/v2/conversations/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}(/notes/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})?$" {
    if ($request_method !~ ^(DELETE|OPTIONS)$) { return 405; }
    include /etc/nginx/elyrn/api-proxy.conf;
    include /etc/nginx/elyrn/api-errors.conf;
}

# Everything else under /api/ does not exist (the status page with 404). One line: make
# check-hardening asserts it verbatim
location /api/ { return 404; }

# Status pages - ensure they are accessible. An intercepted API error is redirected here with
# its request body still attached: allow the largest /api/ bound, or a 401 to a message POST
# would turn into 413
location ~ ^/(76e556a4-0575-4d98-a663-73b1080f26df|90b6b048-4bc9-4083-8585-9063c8e7332e|cb012905-229f-4bf6-bdf4-8778ab34d8d7|e0ab670f-6801-4475-b337-c08d5adb9e73|8ec9c7e3-a58c-40b1-a918-f8cc67c4fc59|9a24ed32-d32d-4b4b-a70e-a0bfd39f6710)\.html$ {
    client_max_body_size 8k;
    try_files $uri =404;
}

# Root path - serve index.html for SPA (revalidated on every load, like its scripts)
location = / {
    expires epoch;
    try_files /index.html =404;
}

# All other paths - return 404 (error_page will handle showing 404 page)
location / {
    return 404;
}
