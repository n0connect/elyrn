# nginx's main configuration (/etc/nginx/nginx.conf; dev.frontend.Dockerfile), replacing the
# image's own so the worker pool is set here, from the frontend container's limits in
# docker-compose.yaml (cpus 1.0, ulimits nofile 4096, mem_limit 128m), instead of the image's
# "worker_processes auto; worker_connections 1024". Everything served is in nginx.conf (rendered
# into conf.d/default.conf) and nginx-site.conf. make check-hardening pins every number below.
#
# Workers: cpus 1.0 is one CPU's time whatever the host has, so one worker; a worker per host
# CPU would only split the descriptor and memory budgets below without adding CPU.
#
# Connections: every client connection and every connection to the backend takes one
# descriptor of the worker's nofile 4096, so the pool could hold up to ~4000; memory binds first.
# Each client connection may hold up to 38 KiB before any location applies (the 1k header
# buffer, at most four 8k buffers for long header lines, the 512-byte connection pool and the
# 4k request pool; nginx-site.conf), bounded in time by client_header_timeout. 1024 connections
# keep that at 38 MiB. Of the 1024, nginx-site.conf hands out (each proxied request takes two:
# the client's and the backend's):
#   event streams        256 at once (limit_conn events_all)  -> 512 connections
#   every other /api/    128 at once (limit_conn api_all)     -> 256 connections
#   page, static files, idle keep-alive                       -> the other 256
#
# Memory, worst case (every part at its bound at the same time) against mem_limit 128 MiB:
#   shared zones (nginx.conf): api 10m, files_per_client 10m, files 1m, api_per_client 1m,
#     api_all 1m, events_per_client 1m, events_all 1m, pages_per_client 1m, pages_all 1m  27 MiB
#   master and worker (code, configuration, connection and event tables)        about  8 MiB
#   1024 client connections x 38 KiB (request headers, pools)                          38 MiB
#   file parts: 32 x (342k body + 8k proxy_buffer_size + 6 x 64k proxy_buffers)       23 MiB
#   message pages (GET): 8 x (8k proxy_buffer_size + 25 x 64k proxy_buffers + 8k body) 13 MiB
#   other /api/ requests: 128 x (8k proxy_buffer_size + 4 x 8k proxy_buffers + 8k body) 6 MiB
#   event streams: 256 x 8k proxy_buffer_size (unbuffered: nothing more)                2 MiB
#   total                                                                             117 MiB
# File parts and pages are among the 128 of api_all, so the lines above overcount them. No
# request body and no proxied answer is ever written to a temporary file: client_body_buffer_size
# holds every admitted body and proxy_max_temp_file_size is 0 (nginx-api-proxy.conf).

worker_processes 1;
pid /run/nginx.pid;
# Zero telemetry, as nginx-site.conf: only critical errors, never a client address
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    include /etc/nginx/conf.d/*.conf;
}
