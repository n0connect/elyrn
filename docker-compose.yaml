# The project name keys the volumes (the Postgres data, the onion key): kept as "noaddx" across the rename to elyrn.
name: noaddx

services:
  postgres:
    image: postgres:15-alpine
    container_name: elyrn-postgres
    security_opt:
      - no-new-privileges:true
    # TLS only (postgres/): the entrypoint hands the key from certs/postgres (make certs) to the
    # postgres user through a tmpfs, pg_hba.conf refuses every TCP connection without TLS
    entrypoint: ["/bin/sh", "/etc/elyrn/entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/elyrn-tls/server.crt
      - -c
      - ssl_key_file=/run/elyrn-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - hba_file=/etc/elyrn/pg_hba.conf
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # make up / make onion pass the certificate's fingerprint: a renewed certificate changes the
    # label, so Compose recreates the container (the data volume stays) and it loads the new one
    labels:
      elyrn.tls-cert-sha256: ${PG_TLS_CERT_SHA256:-}
    tmpfs:
      - /run/elyrn-tls:size=64k,mode=0700,noexec,nosuid,nodev
    # Loopback only: reachable from this machine (psql, local tests), never from the network
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/postgres:/etc/elyrn/tls:ro
      - ./postgres/entrypoint.sh:/etc/elyrn/entrypoint.sh:ro
      - ./postgres/pg_hba.conf:/etc/elyrn/pg_hba.conf:ro
    # Like every other service: after a crash or a host reboot the database comes back too,
    # instead of leaving a running app in front of a stopped database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: dev.backend.Dockerfile
      args:
        # Crypto engine compiled in: openssl (default) or native; both are byte-for-byte equivalent
        ENGINE: ${ENGINE:-openssl}
    image: elyrn-backend:${ENGINE:-openssl}
    container_name: elyrn-backend
    # Static binary running as a non-root user: nothing to write, no capabilities needed
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Only nginx (fixed address below) may supply the client address; otherwise every
      # user would share nginx's address and therefore one rate-limit bucket
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${PROXY_IP:-172.29.73.10}}
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      # The bundled database speaks TLS only: verify its certificate and its name against the
      # private CA from make certs. Not taken from .env (there DB_SSL_MODE serves host-side tools).
      DB_SSL_MODE: verify-full
      PGSSLROOTCERT: /etc/elyrn/db-ca/ca.crt
      BACKEND_PORT: ${BACKEND_PORT}
      MASTER_KEY_ACTIVE: ${MASTER_KEY_ACTIVE}
      MASTER_KEY_ACTIVE_ID: ${MASTER_KEY_ACTIVE_ID}
      MASTER_KEY_OLD: ${MASTER_KEY_OLD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_MIN_LEN: ${JWT_SECRET_MIN_LEN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      ACCOUNT_LOOKUP_PEPPER: ${ACCOUNT_LOOKUP_PEPPER}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH}
      INVITE_TTL_SEC: ${INVITE_TTL_SEC:-86400}
      MAX_ACTIVE_INVITES: ${MAX_ACTIVE_INVITES:-5}
      MAX_CONVERSATIONS_PER_USER: ${MAX_CONVERSATIONS_PER_USER:-256}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-8192}
      MESSAGE_PAGE_LIMIT: ${MESSAGE_PAGE_LIMIT:-200}
      MESSAGE_TTL_DAYS: ${MESSAGE_TTL_DAYS:-7}
      ROOM_MAX_MEMBERS: ${ROOM_MAX_MEMBERS:-16}
      ROOM_MAX_TTL_HOURS: ${ROOM_MAX_TTL_HOURS:-168}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-20}
      POW_CHALLENGE_TTL_SEC: ${POW_CHALLENGE_TTL_SEC:-300}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB}
      ARGON2_TIME: ${ARGON2_TIME}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}
      ARGON2_SALT_LENGTH: ${ARGON2_SALT_LENGTH}
      ARGON2_HASH_LENGTH: ${ARGON2_HASH_LENGTH}
      ARGON2_MAX_CONCURRENT: ${ARGON2_MAX_CONCURRENT:-4}
      PENDING_TOKEN_TTL_SEC: ${PENDING_TOKEN_TTL_SEC}
      PENDING_CLEANUP_INTERVAL_SEC: ${PENDING_CLEANUP_INTERVAL_SEC}
      PENDING_ID_BYTES: ${PENDING_ID_BYTES}
      INTERNAL_ID_LENGTH: ${INTERNAL_ID_LENGTH}
      RATE_LIMIT_MAX_TOKENS: ${RATE_LIMIT_MAX_TOKENS}
      RATE_LIMIT_REFILL_INTERVAL_SEC: ${RATE_LIMIT_REFILL_INTERVAL_SEC}
      RATE_LIMIT_CLEANUP_INTERVAL_SEC: ${RATE_LIMIT_CLEANUP_INTERVAL_SEC}
      RATE_LIMIT_MAX_BUCKETS: ${RATE_LIMIT_MAX_BUCKETS}
      SERVER_READ_HEADER_TIMEOUT_SEC: ${SERVER_READ_HEADER_TIMEOUT_SEC}
      SERVER_READ_TIMEOUT_SEC: ${SERVER_READ_TIMEOUT_SEC}
      SERVER_WRITE_TIMEOUT_SEC: ${SERVER_WRITE_TIMEOUT_SEC}
      SERVER_IDLE_TIMEOUT_SEC: ${SERVER_IDLE_TIMEOUT_SEC}
      SERVER_MAX_HEADER_BYTES: ${SERVER_MAX_HEADER_BYTES}
      # development (default, plain http://localhost) or production (required by make onion)
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL}
    # The database CA only (public); a renewed CA changes the label and recreates the backend
    volumes:
      - ./certs/ca:/etc/elyrn/db-ca:ro
    labels:
      elyrn.db-ca-sha256: ${DB_CA_SHA256:-}
    # Loopback only: browsers must go through nginx (CSP, same-origin); local debugging still works
    ports:
      - "127.0.0.1:8080:8080"
    # Fixed: nginx resolves the backend's name once, at start. A recreated backend that came
    # back on another address would leave nginx answering 502 until nginx restarted too.
    networks:
      default:
        ipv4_address: ${BACKEND_IP:-172.29.73.12}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # GET /api/v2/me without a session must answer 401: proves routing + middleware are up
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://localhost:8080/api/v2/me 2>&1 | grep -q ' 401 ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: dev.frontend.Dockerfile
    container_name: elyrn-frontend
    security_opt:
      - no-new-privileges:true
    environment:
      # The only peer nginx's onion listener (8081) accepts; see nginx.conf
      TOR_IP: ${TOR_IP:-172.29.73.11}
    # Loopback only, like the other services: WebCrypto needs a secure context, so plain HTTP
    # is only ever usable as http://localhost; expose it to a network through TLS instead
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    networks:
      default:
        ipv4_address: ${PROXY_IP:-172.29.73.10}
    depends_on:
      - backend
    restart: unless-stopped

  # Opt-in (make onion): publishes the app as a Tor onion service. Off by default because it
  # makes this instance reachable from anywhere; everything else listens on loopback only.
  tor:
    profiles: ["onion"]
    build:
      context: .
      dockerfile: tor.Dockerfile
    image: elyrn-tor
    container_name: elyrn-tor
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The onion address's private key: losing it changes the address, leaking it lets someone
    # impersonate the service. `make clean` deletes it with every other volume.
    volumes:
      - tor_data:/var/lib/tor
    networks:
      default:
        ipv4_address: ${TOR_IP:-172.29.73.11}
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed so nginx has a known address (PROXY_IP) for TRUSTED_PROXIES; change it with
        # PROXY_IP, BACKEND_IP and TOR_IP in .env if this range collides with another network
        - subnet: ${COMPOSE_SUBNET:-172.29.73.0/24}

volumes:
  postgres_data:
    driver: local
  tor_data:
    driver: local
