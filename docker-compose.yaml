# The project name keys the volumes (the Postgres data, the onion key): kept as "noaddx" across the rename to elyrn.
name: noaddx

# Every service logs through Docker's "local" driver with rotation: the default json-file driver
# never rotates, so a flood of log lines could fill the host's disk. 3 files of 10 MB each, per
# container. make check-hardening asserts it on every service.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine@sha256:a8e042598834300dfaa17a54f695b87b7f25d3490433bbbe2ef3bffbb9747f24
    container_name: elyrn-postgres
    logging: *logging
    # Starts as root only to hand the TLS key to uid 70 (postgres/entrypoint.sh), then the image's
    # entrypoint drops to postgres (uid 70) for good. Those first steps need exactly:
    #   CHOWN            install -o postgres of the key copy and its tmpfs directory
    #   DAC_READ_SEARCH  read the bind-mounted key (0600, owned by the host user) and walk PGDATA (0700, uid 70)
    #   FOWNER           chmod of the copied key after it was handed to uid 70
    #   SETUID, SETGID   gosu's switch to uid/gid 70
    # The server itself runs as uid 70 with no effective capabilities (no-new-privileges)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    # TLS only (postgres/): the entrypoint hands the key from certs/postgres (make certs) to the
    # postgres user through a tmpfs, pg_hba.conf refuses every TCP connection without TLS
    entrypoint: ["/bin/sh", "/etc/elyrn/entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/elyrn-tls/server.crt
      - -c
      - ssl_key_file=/run/elyrn-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - hba_file=/etc/elyrn/pg_hba.conf
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # make up / make onion pass the certificate's fingerprint: a renewed certificate changes the
    # label, so Compose recreates the container (the data volume stays) and it loads the new one
    labels:
      elyrn.tls-cert-sha256: ${PG_TLS_CERT_SHA256:-}
    # Writable besides the data volume: the key copy and the Unix socket with its lock file
    tmpfs:
      - /run/elyrn-tls:size=64k,mode=0700,noexec,nosuid,nodev
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=03775,noexec,nosuid,nodev
    # Default config: shared_buffers 128 MB, max_connections 100 (the backend's pool holds 20).
    # /dev/shm holds parallel-query segments (dynamic_shared_memory_type posix)
    shm_size: 64m
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 200
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    # The data network only: the backend is the one client (no published port; see
    # docker-compose.dev.yaml for local psql)
    networks:
      - data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Long syntax: a missing certs/ (make certs not run) fails the start instead of Docker
      # creating an empty, root-owned directory in its place
      - type: bind
        source: ./certs/postgres
        target: /etc/elyrn/tls
        read_only: true
        bind:
          create_host_path: false
      - ./postgres/entrypoint.sh:/etc/elyrn/entrypoint.sh:ro
      - ./postgres/pg_hba.conf:/etc/elyrn/pg_hba.conf:ro
    # Like every other service: after a crash or a host reboot the database comes back too,
    # instead of leaving a running app in front of a stopped database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: dev.backend.Dockerfile
      args:
        # Crypto engine compiled in: openssl (default) or native; both are byte-for-byte equivalent
        ENGINE: ${ENGINE:-openssl}
    image: elyrn-backend:${ENGINE:-openssl}
    container_name: elyrn-backend
    logging: *logging
    # One binary running as a non-root user: nothing to write, no capabilities needed
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Go reaps no children; tini reaps what an interrupted healthcheck leaves behind
    init: true
    # The file-request pool at its bound (32 x 1.6 MB, backend/internal/handlers/files.go) plus
    # 128 MiB for the runtime, 20 database connections, event streams and the GC's headroom;
    # make check-hardening checks the sum. The rest of the default is margin.
    shm_size: 1m
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    memswap_limit: ${BACKEND_MEM_LIMIT:-512m}
    pids_limit: 256
    cpus: 1.0
    ulimits:
      # Up to 4,096 event streams plus the database pool
      nofile:
        soft: 8192
        hard: 8192
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Only nginx (fixed address below) may supply the client address; otherwise every
      # user would share nginx's address and therefore one rate-limit bucket
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${PROXY_IP:-172.29.73.10}}
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      # The bundled database speaks TLS only: verify its certificate and its name against the
      # private CA from make certs. Not taken from .env (there DB_SSL_MODE serves host-side tools).
      DB_SSL_MODE: verify-full
      PGSSLROOTCERT: /etc/elyrn/db-ca/ca.crt
      # Pinned: nginx (nginx-api-proxy.conf), the healthcheck below and docker-compose.dev.yaml
      # all reach the backend on 8080 inside the container; BACKEND_PORT in .env serves only a
      # backend run outside Compose. make check-hardening asserts the value.
      BACKEND_PORT: "8080"
      MASTER_KEY_ACTIVE: ${MASTER_KEY_ACTIVE}
      MASTER_KEY_ACTIVE_ID: ${MASTER_KEY_ACTIVE_ID}
      MASTER_KEY_OLD: ${MASTER_KEY_OLD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_MIN_LEN: ${JWT_SECRET_MIN_LEN}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      ACCOUNT_LOOKUP_PEPPER: ${ACCOUNT_LOOKUP_PEPPER}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH}
      INVITE_TTL_SEC: ${INVITE_TTL_SEC:-86400}
      MAX_ACTIVE_INVITES: ${MAX_ACTIVE_INVITES:-5}
      MAX_CONVERSATIONS_PER_USER: ${MAX_CONVERSATIONS_PER_USER:-256}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-8192}
      MESSAGE_PAGE_LIMIT: ${MESSAGE_PAGE_LIMIT:-200}
      MESSAGE_TTL_DAYS: ${MESSAGE_TTL_DAYS:-7}
      ROOM_MAX_MEMBERS: ${ROOM_MAX_MEMBERS:-16}
      ROOM_MAX_TTL_HOURS: ${ROOM_MAX_TTL_HOURS:-168}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-10485760}
      FILE_CONVERSATION_QUOTA_BYTES: ${FILE_CONVERSATION_QUOTA_BYTES:-104857600}
      FILE_STORE_MAX_BYTES: ${FILE_STORE_MAX_BYTES:-2147483648}
      FILE_ACCOUNT_DAILY_BYTES: ${FILE_ACCOUNT_DAILY_BYTES:-104857600}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-20}
      POW_CHALLENGE_TTL_SEC: ${POW_CHALLENGE_TTL_SEC:-300}
      PENDING_TOKEN_TTL_SEC: ${PENDING_TOKEN_TTL_SEC}
      PENDING_CLEANUP_INTERVAL_SEC: ${PENDING_CLEANUP_INTERVAL_SEC}
      PENDING_ID_BYTES: ${PENDING_ID_BYTES}
      INTERNAL_ID_LENGTH: ${INTERNAL_ID_LENGTH}
      RATE_LIMIT_MAX_TOKENS: ${RATE_LIMIT_MAX_TOKENS}
      RATE_LIMIT_REFILL_INTERVAL_SEC: ${RATE_LIMIT_REFILL_INTERVAL_SEC}
      RATE_LIMIT_CLEANUP_INTERVAL_SEC: ${RATE_LIMIT_CLEANUP_INTERVAL_SEC}
      RATE_LIMIT_MAX_BUCKETS: ${RATE_LIMIT_MAX_BUCKETS}
      SERVER_READ_HEADER_TIMEOUT_SEC: ${SERVER_READ_HEADER_TIMEOUT_SEC}
      SERVER_READ_TIMEOUT_SEC: ${SERVER_READ_TIMEOUT_SEC}
      SERVER_WRITE_TIMEOUT_SEC: ${SERVER_WRITE_TIMEOUT_SEC}
      SERVER_IDLE_TIMEOUT_SEC: ${SERVER_IDLE_TIMEOUT_SEC}
      SERVER_MAX_HEADER_BYTES: ${SERVER_MAX_HEADER_BYTES}
      # development (default, plain http://localhost) or production (required by make onion)
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL}
      # The Go runtime collects harder before reaching the container limit instead of being killed
      GOMEMLIMIT: ${BACKEND_GOMEMLIMIT:-448MiB}
    # The database CA only (public); a renewed CA changes the label and recreates the backend
    volumes:
      - type: bind
        source: ./certs/ca
        target: /etc/elyrn/db-ca
        read_only: true
        bind:
          create_host_path: false
    labels:
      elyrn.db-ca-sha256: ${DB_CA_SHA256:-}
    # No published port: browsers go through nginx (CSP, same-origin); docker-compose.dev.yaml
    # publishes it on loopback for local debugging. No outbound internet (both networks internal).
    # Fixed: nginx resolves the backend's name once, at start. A recreated backend that came
    # back on another address would leave nginx answering 502 until nginx restarted too.
    networks:
      app:
        ipv4_address: ${BACKEND_IP:-172.29.73.12}
      data: {}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Longer than the backend's shutdown budget (shutdownGrace 10 s + jobStopDeadline 5 s in
    # backend/cmd/server/main.go), so Docker never kills it before it has closed the database
    # and zeroized its keys; make check-hardening reads both constants and checks this
    stop_grace_period: 30s
    healthcheck:
      # /internal/health (loopback only, never forwarded by nginx): 200 once the database answers
      # SELECT 1 within 3 s and retention is cycling, else 503
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/internal/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Room for the bounded wait for the database at start (60 s)
      start_period: 70s

  frontend:
    build:
      context: .
      dockerfile: dev.frontend.Dockerfile
    container_name: elyrn-frontend
    logging: *logging
    # nginx as its own unprivileged user (101) from the start: it listens on 8080 and 8081
    # inside the container, so it needs no capability at all
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Writable: the rendered config (the image's entrypoint writes it from the template), the pid
    # file and nginx's temporary files; the static files stay read-only
    tmpfs:
      - /etc/nginx/conf.d:size=64k,uid=101,gid=101,mode=0755,noexec,nosuid,nodev
      - /run:size=64k,uid=101,gid=101,mode=0755,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0755,noexec,nosuid,nodev
    shm_size: 1m
    mem_limit: 128m
    memswap_limit: 128m
    # worker_processes auto: one worker per host CPU, plus the master
    pids_limit: 128
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    environment:
      # The only peer nginx's onion listener (8081) accepts; see nginx.conf
      TOR_IP: ${TOR_IP:-172.29.72.11}
      # Your own TLS-terminating reverse proxy in front of nginx (IPs/CIDRs, comma-separated;
      # empty: none): only a request from one of these may name the client (X-Forwarded-For)
      # and the protocol (X-Forwarded-Proto). nginx.conf, nginx-edge-proxies.sh
      EDGE_TRUSTED_PROXIES: ${EDGE_TRUSTED_PROXIES:-}
      # HSTS (nginx-hsts.sh): sent on every answer of the clearnet listener in production, when a
      # listed edge proxy said the request came over HTTPS. Empty max-age: one year; 0: off. A
      # malformed value stops nginx at start.
      APP_ENV: ${APP_ENV:-development}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      HSTS_PRELOAD: ${HSTS_PRELOAD:-false}
    # Loopback only, like the other services: WebCrypto needs a secure context, so plain HTTP
    # is only ever usable as http://localhost; expose it to a network through TLS instead.
    # The only published port of the stack.
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:8080"
    # edge: published port and tor. app: the backend sees nginx at PROXY_IP (TRUSTED_PROXIES).
    networks:
      edge: {}
      app:
        ipv4_address: ${PROXY_IP:-172.29.73.10}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Opt-in (make onion): publishes the app as a Tor onion service. Off by default because it
  # makes this instance reachable from anywhere; everything else listens on loopback only.
  tor:
    profiles: ["onion"]
    build:
      context: .
      dockerfile: tor.Dockerfile
    image: elyrn-tor
    container_name: elyrn-tor
    logging: *logging
    # tor.Dockerfile's unprivileged user (uid 100 in the pinned Debian image)
    user: debian-tor
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    shm_size: 1m
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    cpus: 1.0
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    # The onion address's private key: losing it changes the address, leaking it lets someone
    # impersonate the service. `make clean` deletes it with every other volume.
    volumes:
      - tor_data:/var/lib/tor
    # edge only: tor needs the internet, and reaches nginx's onion listener, never the backend
    networks:
      edge:
        ipv4_address: ${TOR_IP:-172.29.72.11}
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    # Healthy once the service is published (its address exists); the first start takes a minute
    healthcheck:
      test: ["CMD", "test", "-s", "/var/lib/tor/noaddx/hostname"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

# Three networks, each holding only the services that must talk (docs/operations/hardening.md):
#   edge  nginx, tor        the published port and tor's way out; the only one with internet
#   app   nginx, backend    internal; the backend trusts nginx's fixed address here (PROXY_IP)
#   data  backend, postgres internal; nothing else reaches the database
# Fixed ranges so the addresses in .env stay valid; change a range together with its addresses
# if it collides with another network.
networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.29.72.0/24}
  app:
    internal: true
    driver_opts: &isolated
      # No address on the bridge: the host cannot route into this network, so neither the host
      # nor a container on another network reaches it, even where the runtime routes between
      # bridges (Docker Engine 28+)
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        # PROXY_IP (nginx) and BACKEND_IP live here: the range kept its pre-split name
        - subnet: ${COMPOSE_SUBNET:-172.29.73.0/24}
  data:
    internal: true
    driver_opts: *isolated
    ipam:
      config:
        - subnet: ${DATA_SUBNET:-172.29.74.0/24}

volumes:
  postgres_data:
    driver: local
  tor_data:
    driver: local
