# Rendered by the nginx image at start (templates/default.conf.template -> conf.d/default.conf):
# ${TOR_IP} below is the tor container's fixed address. The edge-proxies.* files beside it are
# rendered by nginx-edge-proxies.sh from EDGE_TRUSTED_PROXIES. Everything else is in
# nginx-site.conf.

# The client address: the TCP peer (on the clearnet listener, the client a listed edge proxy
# names; see EDGE_TRUSTED_PROXIES above), or the Tor circuit that the onion listener's PROXY
# header names. The clearnet listener never parses PROXY headers.
map $proxy_protocol_addr $client_addr {
    ""      $remote_addr;
    default $proxy_protocol_addr;
}

# EDGE_TRUSTED_PROXIES: the operator's own TLS-terminating proxies in front of the clearnet
# listener (empty by default). nginx-edge-proxies.sh renders them at start into the two files
# included here and in the clearnet server below; a malformed list stops the container.
#
# ZERO-TRUST. Behind such a proxy every TCP peer is the proxy, so without this every user would
# share one rate-limit bucket here and in the backend, and the backend would never learn that the
# request came over HTTPS. With it, the clearnet server's realip directives replace $remote_addr
# by the client the proxy names in X-Forwarded-For, but only for a request whose TCP peer is
# listed (set_real_ip_from); X-Forwarded-For from anyone else changes nothing. The protocol is
# decided on $realip_remote_addr, which keeps the TCP peer after realip replaced $remote_addr:
# $edge_peer is 1 only when that peer is listed, and only then, and only on the clearnet listener
# (empty $proxy_protocol_addr; the onion listener's peer is tor, never an edge proxy), may
# X-Forwarded-Proto name http or https. Every other request gets $scheme. Nobody unlisted can
# choose the client address or the protocol nginx passes on.
geo $realip_remote_addr $edge_peer {
    default 0;
    include /etc/nginx/conf.d/edge-proxies.geo;
}

map "$proxy_protocol_addr|$edge_peer|$http_x_forwarded_proto" $forwarded_proto {
    default    $scheme;
    "|1|https" https;
    "|1|http"  http;
}

# Strict-Transport-Security, sent by nginx-site.conf's server-level add_header on every answer
# whose $hsts is not empty. nginx-hsts.sh renders the one entry from APP_ENV and HSTS_* at start:
# in production with a max-age above 0, "|https", which matches only the clearnet listener (empty
# PROXY address) when a listed edge proxy said the request came over HTTPS. Development, a
# max-age of 0, the onion listener and a protocol nobody listed vouched for: empty, no header.
map "$proxy_protocol_addr|$forwarded_proto" $hsts {
    default "";
    include /etc/nginx/conf.d/hsts.map;
}

# Coarse per-client limit in front of every API route (the backend adds per-client,
# per-account and per-identity limits). In-memory only; nothing is logged.
limit_req_zone $client_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# File part requests: each holds up to about 0.73 MB here (the 342k request buffer and the
# 6 x 64k response buffers of the files location), so the 32 nginx-site.conf admits at once, all
# clients together, take at most 24 MB of this container's 128 MB; 32 is the backend's own bound
# too (handlers.maxConcurrentFileRequests). One client address (as the request limit counts it:
# the client, or the Tor circuit) holds at most 4 of them, so it cannot take the pool alone.
map $request_method $file_requests_key {
    default all;
}
limit_conn_zone $file_requests_key zone=files:1m;
limit_conn_zone $client_addr zone=files_per_client:10m;

# Clearnet: http://localhost in development; put TLS in front of it for any network. 8080 inside
# the container (unprivileged, so nginx needs no capability); compose publishes it as HTTP_PORT.
server {
    listen 8080;
    server_name localhost;
    # EDGE_TRUSTED_PROXIES (above): set_real_ip_from per listed proxy, or nothing at all
    include /etc/nginx/conf.d/edge-proxies.realip;
    include /etc/nginx/elyrn/site.conf;
}

# Onion service (make onion): only the tor container may connect, and every connection must
# open with a PROXY header naming its circuit (HiddenServiceExportCircuitID haproxy). Nothing
# else can reach this port, so nobody else can claim to be a Tor circuit.
server {
    listen 8081 proxy_protocol;
    server_name _;
    allow ${TOR_IP};
    deny all;
    include /etc/nginx/elyrn/site.conf;
}
