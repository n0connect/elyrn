# Included by every /api/ location in nginx-site.conf (/etc/nginx/elyrn/api-proxy.conf): the
# rate limit and the hop to the backend, with forwarding headers nginx alone sets.

limit_req zone=api burst=40 nodelay;
proxy_pass http://elyrn-backend:8080;

# ZERO-TRUST: proxy_set_header replaces whatever the client sent under these names. The backend
# trusts them only from TRUSTED_PROXIES (this container's fixed address on the app network in
# docker-compose.yaml); see backend/internal/middleware/trustedproxy.go
proxy_set_header Host $host;
proxy_set_header X-Real-IP $client_addr;
# $client_addr only, never $proxy_add_x_forwarded_for: the client cannot extend the chain (behind
# a listed edge proxy $client_addr is already the client it names; nginx.conf)
proxy_set_header X-Forwarded-For $client_addr;
# $forwarded_proto: a listed edge proxy's X-Forwarded-Proto (http or https), else $scheme
# (nginx.conf EDGE_TRUSTED_PROXIES)
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;

# nginx-site.conf sends these three on every response; the backend's copies (the same values,
# for a backend reached without nginx) are dropped so a browser never gets two of one, which
# would make it parse neither
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
