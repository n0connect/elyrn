# Included by every /api/ location in nginx-site.conf (/etc/nginx/elyrn/api-proxy.conf): the
# rate limit and the hop to the backend, with forwarding headers nginx alone sets.

limit_req zone=api burst=40 nodelay;
proxy_pass http://elyrn-backend:8080;

# ZERO-TRUST: proxy_set_header replaces whatever the client sent under these names. The backend
# trusts them only from TRUSTED_PROXIES (this container's fixed address on the app network in
# docker-compose.yaml); see backend/internal/middleware/trustedproxy.go
proxy_set_header Host $host;
proxy_set_header X-Real-IP $client_addr;
# $client_addr only, never $proxy_add_x_forwarded_for: the client cannot extend the chain
proxy_set_header X-Forwarded-For $client_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
